<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Golden Dragon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="solid-bg-page">
    <header>
        <a href="index.html" class="logo">GOLDEN DRAGON</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active btn">Book a Table</a>
        </nav>
    </header>
    <main class="page-content contact-layout">
        <div class="contact-info">
            <h1>Visit Us</h1>
            <p><strong>Location:</strong><br>iTowers, Gaborone, Botswana<br>(Near Room50Two)</p>
            <p><strong>Hours:</strong><br>Mon - Sun: 11:00 AM - 10:00 PM</p>
            <p><strong>Phone:</strong><br>+267 123 4567</p>
        </div>
        <div class="contact-form">
            <h2>Reserve a Table</h2>
            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <input type="date" required>
                <button type="submit" class="cta-btn">Request Booking</button>
            </form>
        </div>
    </main>
</body>
</html>
